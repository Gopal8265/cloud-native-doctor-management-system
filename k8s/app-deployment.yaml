apiVersion: apps/v1
kind: Deployment

metadata:
  name: hospital-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hospital-app

  template:
    metadata:
      labels:
        app: hospital-app

    spec:
      containers:
        - name: hospital-app
          image: gopal82/hospital-mis:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: APP_SETTINGS
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: APP_SETTINGS

            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: DATABASE_URL

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospital-secret
                  key: DB_PASSWORD