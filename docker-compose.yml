version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: hospital-db
    restart: always

    environment:
      POSTGRES_DB: hospital_db
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .

    container_name: hospital-app

    restart: always

    depends_on:
      - db

    env_file:
      - .env

    ports:
      - "5001:5000"

volumes:
  postgres_data:
